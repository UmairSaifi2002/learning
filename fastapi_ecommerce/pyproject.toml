[project]
name = "fastpi-ecommerce"
version = "0.1.0"
description = ""
authors = [
    {name = "UmairSaifi2002",email = "umairsaifi2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic[email] (>=2.13.3,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlmodel (>=0.0.38,<0.0.39)",
    "pymysql (>=1.1.2,<2.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "fastpi_ecommerce", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


